name: 上游自动同步
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      workflows: write
    steps:
      - name: 同步上游
        run: gh repo sync a-scc/rea --source morluto/rea
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
